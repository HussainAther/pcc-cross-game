[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcc-cross-game"
version = "0.1.0"
description = "Neutral comparison layer for frozen PCC game-validation repositories"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pcc-cross-game = "pcc_cross_game.cli:main"

[tool.setuptools.packages.find]
include = ["pcc_cross_game*"]
